# Fly.io deployment for PadelFinderBackend.
#
# Single machine on purpose. `AvailabilityCache` and the Kus Tba refresher both
# live in-process, so a second instance would serve a different cache and send a
# second crawler at Kus Tba's site. Scaling past one waits on Redis
# (SYSTEM-DESIGN-DIAGRAMS.md section 9).
#
# Deploy with `fly deploy --remote-only --ha=false`. The flag is not expressible
# in this file: Fly creates two machines for high availability unless told
# otherwise, and the settings below do not override that on a first deploy.

app = 'padelfinder-ge'
primary_region = 'fra' # Frankfurt - closest available region to Tbilisi (otp/waw are deprecated)

[build]

# Migrations run here, not at boot: a failed migration fails the deploy instead
# of leaving a half-migrated database serving traffic (BUILD-PLAN.md section 4).
[deploy]
  release_command = 'migrate --yes'

[env]
  LOG_LEVEL = 'info'
  # DATABASE_URL and JWT_SECRET are Fly secrets, not env entries - the app
  # refuses to boot in production without either.
  # Fly's proxy sets this header from the real connection, so it cannot be
  # forged from outside. Without it every request looks like it comes from the
  # proxy and the per-IP code limit would apply to all callers at once. Never
  # point this at X-Forwarded-For, which any client can send.
  TRUSTED_CLIENT_IP_HEADER = 'Fly-Client-IP'
  # Turns relative asset paths (/logos/x.png) into absolute URLs in responses.
  # Must be changed together with the app name.
  PUBLIC_BASE_URL = 'https://padelfinder-ge.fly.dev'
  # Accepted `aud` values for the social sign-in endpoints. Client ids are
  # public identifiers by design - they travel inside every identity token we
  # receive - so they belong here and not in `fly secrets`. Empty or absent
  # means the matching endpoint answers 503 `provider_not_configured`, which is
  # the safe default: it never accepts an unaudienced token.
  #
  # Apple needs only the bundle id, exactly as registered. The server verifies
  # the native token against Apple's public JWKS, so there is no Services ID
  # and no client secret here.
  APPLE_CLIENT_IDS = 'GR.PadelFinder'
  # Uncomment with the iOS OAuth client id from Google Cloud Console. Left
  # commented, Continue with Google stays honestly off in production rather
  # than half-configured.
  # GOOGLE_CLIENT_IDS = '000000000000-abcdefghijklmnop.apps.googleusercontent.com'
  # No KUSTBA_* settings while ProviderFeatureFlags.kustbaPadel is false - the
  # refresher does not start. When it goes back on, the warm window and the 14
  # days the API accepts have to be reconciled deliberately: matching them at
  # the default 30-minute far cadence cost their site ~22,800 requests a day,
  # against ~16,900 at a 60-minute one.

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  # Must stay up: suspending the machine kills the warm Kus Tba cache, and the
  # next request falls back to a 13-24s inline fetch.
  auto_stop_machines = 'off'
  min_machines_running = 1
  max_machines_running = 1

  [[http_service.checks]]
    method = 'GET'
    path = '/health'
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
